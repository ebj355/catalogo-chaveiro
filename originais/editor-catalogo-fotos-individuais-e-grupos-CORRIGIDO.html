<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor do Catálogo — Chaveiro Senador</title>
<style>
  :root{
    --bg: #16181c;
    --panel: #1e2126;
    --panel-2: #262a31;
    --border: #33373d;
    --text: #e8e6e1;
    --text-dim: #9a9a94;
    --brass: #c99a4a;
    --brass-light: #e7c07d;
    --danger: #c0553f;
    --danger-light: #e07a63;
    --ok: #5a9464;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.4;
  }
  header{
    position:sticky; top:0; z-index:50;
    background: linear-gradient(180deg, #1a1c20, #17181b);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px;
  }
  header h1{
    font-size: 17px; margin:0; font-weight:700; letter-spacing:.2px;
    color: var(--brass-light);
  }
  header h1 span{ color: var(--text-dim); font-weight:400; font-size:13px; display:block; margin-top:2px; }
  .toolbar{ display:flex; gap:8px; flex-wrap:wrap; }
  button, .btn{
    font: inherit; cursor:pointer; border:none; border-radius:8px;
    padding: 9px 14px; font-size:13.5px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px;
    transition: filter .15s ease, transform .05s ease;
  }
  button:active{ transform: translateY(1px); }
  .btn-brass{ background: var(--brass); color:#20140a; }
  .btn-brass:hover{ filter:brightness(1.08); }
  .btn-ghost{ background: var(--panel-2); color: var(--text); border:1px solid var(--border); }
  .btn-ghost:hover{ filter:brightness(1.15); }
  .btn-danger{ background: transparent; color: var(--danger-light); border:1px solid var(--danger); }
  .btn-danger:hover{ background: rgba(192,85,63,0.12); }
  .btn-sm{ padding:6px 10px; font-size:12.5px; }
  input[type=file]{ display:none; }

  main{ max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }

  #empty-state{
    text-align:center; padding: 80px 20px; color: var(--text-dim);
  }
  #empty-state .big{ font-size:15px; color:var(--text); margin-bottom:10px; }

  .status{
    font-size: 12.5px; color: var(--text-dim); margin-top:4px;
  }
  .status.ok{ color: var(--ok); }
  .status.err{ color: var(--danger-light); }

  .cat-card{
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    margin-bottom: 16px;
    overflow:hidden;
  }
  .cat-head{
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px;
    cursor:pointer;
    user-select:none;
  }
  .cat-head:hover{ background: rgba(255,255,255,0.02); }
  .cat-icon-badge{
    font-size:22px; width:38px; height:38px; flex:0 0 38px;
    display:flex; align-items:center; justify-content:center;
    background: var(--panel-2); border-radius:10px;
  }
  .cat-head-info{ flex:1; min-width:0; }
  .cat-head-info .name{ font-weight:700; font-size:15px; color: var(--brass-light); }
  .cat-head-info .meta{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .cat-move{ display:flex; flex-direction:column; gap:2px; }
  .cat-move-btn{
    width:22px; height:16px; padding:0; font-size:9px; line-height:1;
    background: var(--panel-2); border:1px solid var(--border); border-radius:4px;
    color: var(--text-dim); display:flex; align-items:center; justify-content:center;
  }
  .cat-move-btn:hover{ color: var(--brass-light); border-color: var(--brass); }
  .cat-move-btn:disabled{ opacity:.3; cursor:default; }
  .chev{ font-size:13px; color: var(--text-dim); transition: transform .15s ease; }
  .cat-card.open .chev{ transform: rotate(90deg); }

  .cat-body{ display:none; padding: 0 16px 18px; border-top:1px solid var(--border); }
  .cat-card.open .cat-body{ display:block; }

  .field-grid{
    display:grid; grid-template-columns: 90px 1fr; gap:8px 12px;
    align-items:center; margin: 14px 0;
  }
  .field-grid label{ font-size:12.5px; color:var(--text-dim); }
  .field-grid input, .field-grid textarea{
    width:100%; background: var(--panel-2); border:1px solid var(--border);
    color: var(--text); border-radius:8px; padding:8px 10px; font: inherit; font-size:13.5px;
  }
  .field-grid textarea{ resize:vertical; min-height:38px; }
  .id-hint{ font-size:11px; color:var(--text-dim); grid-column:2; margin-top:-4px; }

  .products-title{
    display:flex; align-items:center; justify-content:space-between;
    margin: 18px 0 10px;
  }
  .products-title h3{ margin:0; font-size:13px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.5px; }

  .product-card{
    background: var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding: 12px;
    margin-bottom:10px;
    display:flex; gap:12px;
  }
  .photo-box{
    flex: 0 0 76px; width:76px; height:76px;
    border-radius:10px; overflow:hidden;
    background: repeating-linear-gradient(45deg,#2a2d33,#2a2d33 6px,#25272c 6px,#25272c 12px);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; position:relative; border:1px dashed var(--border);
  }
  .photo-box img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-box .ph-label{ font-size:10.5px; color:var(--text-dim); text-align:center; padding:4px; }
  .photo-box:hover{ border-color: var(--brass); }
  .photo-box.hidden{ display:none; }
  .photo-box .remove-photo{
    position:absolute; top:2px; right:2px; background:rgba(0,0,0,.6);
    color:#fff; border-radius:50%; width:18px; height:18px; font-size:11px;
    display:flex; align-items:center; justify-content:center;
  }

  .product-fields{ flex:1; min-width:0; display:grid; grid-template-columns: 1fr 1fr; gap:8px; }
  .product-fields .full{ grid-column: 1 / -1; }
  .product-fields label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:2px; }
  .product-fields input, .product-fields textarea{
    width:100%; background: var(--panel); border:1px solid var(--border);
    color: var(--text); border-radius:7px; padding:7px 9px; font: inherit; font-size:13px;
  }
  .product-fields textarea{ resize:vertical; min-height:34px; }
  .product-actions{ flex:0 0 auto; display:flex; flex-direction:column; gap:6px; justify-content:flex-start; }

  /* Card de grupo de fechadura: uma foto só, compartilhada por todos os itens */
  .lock-group-card{
    background: var(--panel-2);
    border:1px solid var(--border);
    border-radius:12px;
    padding: 12px;
    margin-bottom:14px;
  }
  .lock-group-header{ display:flex; gap:12px; align-items:flex-start; }
  .lock-group-photo-box{ flex:0 0 76px; width:76px; height:76px; }
  .lock-group-header-fields{ flex:1; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .lock-group-header-fields label{ font-size:11px; color:var(--text-dim); display:block; margin-bottom:2px; }
  .lock-group-header-fields input, .lock-group-header-fields select{
    width:100%; background: var(--panel); border:1px solid var(--border);
    color: var(--text); border-radius:7px; padding:7px 9px; font: inherit; font-size:13px;
  }
  .lock-group-header-actions{ flex:0 0 auto; }
  .lock-group-items-list{ margin-top:12px; padding-top:10px; border-top:1px dashed var(--border); }
  .lock-item-row{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; }
  .lock-item-photo-box{ flex:0 0 76px; width:76px; height:76px; }
  .lock-item-photo-box.hidden{ display:none; }
  .lock-group-photo-box, .lock-item-photo-box{ flex:0 0 76px; width:76px; height:76px; }

  .lock-item-row + .lock-item-row{ border-top:1px solid var(--border); }
  .lock-item-fields{ flex:1; min-width:0; }
  .lock-item-del{ flex:0 0 auto; margin-top:16px; }
  .add-product-btn.btn-sm{ margin-top:10px; padding:8px; font-size:12.5px; }

  .add-product-btn{ width:100%; margin-top:4px; justify-content:center; border:1px dashed var(--border); background:transparent; color:var(--text-dim); }
  .add-product-btn:hover{ color: var(--brass-light); border-color: var(--brass); }

  .cat-footer-actions{ display:flex; justify-content:flex-end; margin-top:14px; }

  #add-category-btn{ width:100%; margin-top: 4px; justify-content:center; padding:14px; border:1px dashed var(--border); background:transparent; color:var(--text-dim); border-radius:14px; }
  #add-category-btn:hover{ color: var(--brass-light); border-color: var(--brass); }

  .warn-banner{
    background: rgba(201,154,74,0.1); border:1px solid rgba(201,154,74,0.35);
    color: var(--brass-light); border-radius:10px; padding:10px 14px; font-size:12.5px;
    margin-bottom:18px; display:none;
  }
  .warn-banner.show{ display:block; }

  .lock-note{ font-size:11.5px; color:var(--text-dim); margin-top:6px; }
</style>
</head>
<body>

<header>
  <h1>Editor do Catálogo <span>Chaveiro Senador — ferramenta externa (roda só no seu navegador)</span></h1>
  <div class="toolbar">
    <input type="file" id="file-input" accept=".html">
    <button class="btn-brass" id="load-btn">Carregar catálogo (.html)</button>
    <button class="btn-ghost" id="save-btn" disabled>Baixar catálogo atualizado</button>
  </div>
</header>

<main>
  <div id="empty-state">
    <div class="big">Nenhum catálogo carregado ainda.</div>
    <div>Clique em "Carregar catálogo (.html)" e selecione o arquivo do catálogo que você já tem.<br>
    Tudo é processado localmente no seu navegador — nada é enviado para nenhum servidor.</div>
  </div>

  <div id="editor-root" style="display:none;">
    <div class="warn-banner" id="parse-warning"></div>
    <div id="categories-list"></div>
    <button id="add-category-btn">+ Adicionar nova categoria</button>
  </div>
</main>

<script>
(function(){
  "use strict";

  let rawHtml = "";           // texto completo do arquivo carregado
  let categorias = null;      // array de categorias (parseado)
  let imagensCustom = {};     // mapa de fotos customizadas (novas/trocadas)
  let tamanhosCustom = {};    // mapa de tamanho customizado por grupo de fechadura (em px)
  let allImageMaps = {};      // { NOME_DO_MAP: {chave: dataURL} } — apenas para preview
  let imagensOcultas = {};     // fotos existentes no catálogo que o usuário escolheu ocultar

  const TAMANHOS_GRUPO = [
    { valor: '', label: 'Padrão' },
    { valor: '110', label: 'Pequena' },
    { valor: '150', label: 'Média' },
    { valor: '190', label: 'Grande' }
  ];

  const fileInput = document.getElementById('file-input');
  const loadBtn = document.getElementById('load-btn');
  const saveBtn = document.getElementById('save-btn');
  const emptyState = document.getElementById('empty-state');
  const editorRoot = document.getElementById('editor-root');
  const catList = document.getElementById('categories-list');
  const parseWarning = document.getElementById('parse-warning');

  loadBtn.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', handleFileSelect);
  saveBtn.addEventListener('click', exportCatalog);
  document.getElementById('add-category-btn').addEventListener('click', addCategory);

  function handleFileSelect(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        loadCatalog(evt.target.result);
      }catch(err){
        alert("Não consegui ler esse arquivo como catálogo válido.\n\nDetalhe técnico: " + err.message);
        console.error(err);
      }
    };
    reader.readAsText(file, 'utf-8');
  }

  // ---------- Parsing ----------

  // Extrai um bloco "const NOME = <literal>;" contando chaves/colchetes,
  // ignorando conteúdo dentro de strings (aspas simples, duplas ou template).
  function extractDeclaration(text, name){
    const marker = "const " + name + " = ";
    const idx = text.indexOf(marker);
    if(idx === -1) return null;
    const openIdx = idx + marker.length;
    const openChar = text[openIdx];
    if(openChar !== '[' && openChar !== '{') return null;
    const closeChar = openChar === '[' ? ']' : '}';
    let depth = 0, i = openIdx, inString = false, strChar = '', escaped = false;
    for(; i < text.length; i++){
      const ch = text[i];
      if(inString){
        if(escaped){ escaped = false; }
        else if(ch === '\\'){ escaped = true; }
        else if(ch === strChar){ inString = false; }
        continue;
      }
      if(ch === '"' || ch === "'" || ch === '`'){ inString = true; strChar = ch; continue; }
      if(ch === openChar) depth++;
      else if(ch === closeChar){
        depth--;
        if(depth === 0){ i++; break; }
      }
    }
    let end = i;
    while(end < text.length && text[end] !== ';') end++;
    end++;
    return { declStart: idx, contentStart: openIdx, contentEnd: i, end: end, content: text.slice(openIdx, i) };
  }

  function evalLiteral(jsLiteralText){
    // eslint-disable-next-line no-new-func
    return (new Function("return (" + jsLiteralText + ");"))();
  }

  function loadCatalog(text){
    rawHtml = text;
    parseWarning.classList.remove('show');
    parseWarning.textContent = "";

    const catDecl = extractDeclaration(text, "CATEGORIAS");
    if(!catDecl){
      throw new Error("Não encontrei 'const CATEGORIAS = [...]' no arquivo. Confirme que é o arquivo certo do catálogo.");
    }
    categorias = evalLiteral(catDecl.content);

    // Extrai todos os "const IMAGENS_XXX = {...}" existentes, só para preview de fotos.
    allImageMaps = {};
    const mapRegex = /const (IMAGENS_[A-Z_]+)\s*=\s*/g;
    let m;
    while((m = mapRegex.exec(text)) !== null){
      const varName = m[1];
      const d = extractDeclaration(text, varName);
      if(d){
        try{ allImageMaps[varName] = evalLiteral(d.content); }
        catch(e){ /* ignora mapas que não consigamos avaliar */ }
      }
    }
    imagensCustom = allImageMaps['IMAGENS_CUSTOM'] || {};
    const ocultasDecl = extractDeclaration(text, "IMAGENS_OCULTAS");
    imagensOcultas = {};
    if(ocultasDecl){
      try{ imagensOcultas = evalLiteral(ocultasDecl.content) || {}; }
      catch(e){ /* ignora se não conseguir avaliar */ }
    }

    const tamanhosDecl = extractDeclaration(text, "TAMANHOS_CUSTOM");
    tamanhosCustom = {};
    if(tamanhosDecl){
      try{ tamanhosCustom = evalLiteral(tamanhosDecl.content) || {}; }
      catch(e){ /* ignora se não conseguir avaliar */ }
    }

    const hasCustomInfra = text.indexOf('IMAGENS_CUSTOM') !== -1 &&
                            text.indexOf('IMAGENS_CUSTOM[p.foto]') !== -1;
    if(!hasCustomInfra){
      parseWarning.textContent = "Este arquivo é de uma versão mais antiga do catálogo (sem o suporte genérico a fotos). "
        + "Não tem problema: ao baixar, esta ferramenta já inclui automaticamente o que falta para tudo funcionar.";
      parseWarning.classList.add('show');
    }

    renderCategories();
    emptyState.style.display = 'none';
    editorRoot.style.display = 'block';
    saveBtn.disabled = false;
  }

  // ---------- Foto lookup para preview ----------

  // Cada categoria tem seu próprio mapa de imagens.
  // Nunca fazemos fallback para "qualquer" IMAGENS_XXX, porque chaves como
  // "yale" existem em mais de um mapa (ex.: IMAGENS_CHAVE e IMAGENS_CADEADO).
  const CATEGORY_IMAGE_MAPS = {
    'copia-chaves': ['IMAGENS_CHAVE'],
    'chaveirinho': ['IMAGENS_CHAVEIRINHO'],
    'controle-portao': ['IMAGENS_CONTROLE'],
    'bateria': ['IMAGENS_BATERIA'],
    'cadeados': ['IMAGENS_CADEADO'],
    'miolos': ['IMAGENS_MIOLO', 'IMAGENS_GAVETA', 'IMAGENS_MIOLO_GRANDE', 'IMAGENS_MIOLO_TETRA'],
    'aberturas': ['IMAGENS_ABERTURAS'],
    'chaves-codificadas': ['IMAGENS_CODIFICADAS']
  };

  function findPhotoSrc(fotoKey, cat){
    if(!fotoKey || imagensOcultas[fotoKey]) return null;

    // REGRA PRINCIPAL: o preview do editor deve reproduzir a mesma origem
    // de imagem usada pelo catálogo. Nunca procure uma foto em outro mapa
    // só porque a chave tem o mesmo nome (ex.: "yale" em CHAVE x CADEADO).
    const mapNames = cat && CATEGORY_IMAGE_MAPS[cat.id] ? CATEGORY_IMAGE_MAPS[cat.id] : [];
    for(const mapName of mapNames){
      const map = allImageMaps[mapName];
      if(map && map[fotoKey]){
        // Se houver uma foto customizada antiga com a mesma chave, ela só
        // pode substituir a foto nativa quando o catálogo realmente possui
        // essa chave na categoria atual. Isso impede uma IMAGENS_CUSTOM["yale"]
        // antiga de fazer um cadeado receber a foto de uma chave.
        if(imagensCustom[fotoKey]) return imagensCustom[fotoKey];
        return map[fotoKey];
      }
    }

    // Não existe foto nativa para esta categoria. Antes de aceitar uma
    // IMAGENS_CUSTOM antiga, verificamos se ela é literalmente a mesma
    // imagem de outro mapa do catálogo. Isso corrige o caso clássico:
    // cadeado com foto:"yale" + IMAGENS_CUSTOM["yale"] contendo a foto
    // da chave Yale. Nesse caso, o editor deve respeitar o catálogo e não
    // importar a imagem de outra categoria.
    if(imagensCustom[fotoKey]){
      const customSrc = imagensCustom[fotoKey];
      let duplicateFromAnotherCategory = false;
      for(const mapName in allImageMaps){
        if(mapNames.includes(mapName) || mapName === 'IMAGENS_CUSTOM' || mapName === 'IMAGENS_OCULTAS') continue;
        const map = allImageMaps[mapName];
        if(map && map[fotoKey] && map[fotoKey] === customSrc){
          duplicateFromAnotherCategory = true;
          break;
        }
      }
      if(!duplicateFromAnotherCategory){
        return customSrc;
      }
    }

    return null;
  }

  function findGroupPhotoSrc(grupoNome){
    if(!grupoNome || imagensOcultas['group:' + grupoNome]) return null;
    // Grupos de fechadura usam exclusivamente IMAGENS_FECHADURA para a foto original.
    // A foto adicionada pelo editor continua tendo prioridade.
    if(imagensCustom[grupoNome]) return imagensCustom[grupoNome];
    const map = allImageMaps['IMAGENS_FECHADURA'];
    return map && map[grupoNome] ? map[grupoNome] : null;
  }

  function findProductPhotoSrc(cat, prod){
    if(!prod || prod.semFoto) return null;
    if(prod.fotoModo === 'grupo' && prod.grupo){
      return findGroupPhotoSrc(prod.grupo);
    }
    if(prod.foto) return findPhotoSrc(prod.foto, cat);
    // Cópia de chaves usa 'tipo' como chave do mapa IMAGENS_CHAVE.
    if(cat && cat.id === 'copia-chaves' && prod.tipo){
      return findPhotoSrc(prod.tipo, cat);
    }
    return null;
  }

  // ---------- Render ----------

  function slugify(str){
    return (str || "")
      .toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/(^-|-$)/g, '') || ('categoria-' + Date.now());
  }

  function uniqueFotoKey(){
    return 'custom_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7);
  }

  // Agrupa produtos consecutivos que têm o mesmo "grupo" — mesma lógica usada
  // na hora de montar as páginas do catálogo, para o editor bater certinho com o resultado final.
  function agruparConsecutivos(produtos){
    const grupos = [];
    let atual = null;
    produtos.forEach((prod, prodIdx) => {
      if(!atual || atual.nome !== prod.grupo){
        atual = { nome: prod.grupo, itens: [] };
        grupos.push(atual);
      }
      atual.itens.push({ prod, prodIdx });
    });
    return grupos;
  }

  function renderCategories(){
    catList.innerHTML = "";
    categorias.forEach((cat, catIdx) => {
      catList.appendChild(renderCategoryCard(cat, catIdx));
    });
  }

  function renderCategoryCard(cat, catIdx){
    const card = document.createElement('div');
    card.className = 'cat-card';

    const head = document.createElement('div');
    head.className = 'cat-head';
    head.innerHTML = `
      <div class="cat-icon-badge">${escapeHtml(cat.icone || '📦')}</div>
      <div class="cat-head-info">
        <div class="name">${escapeHtml(cat.nome || '(sem nome)')}</div>
        <div class="meta">${(cat.produtos || []).length} produto(s) · id: ${escapeHtml(cat.id || '')}</div>
      </div>
      <div class="cat-move">
        <button class="cat-move-btn" data-move="up" title="Mover categoria para cima" ${catIdx === 0 ? 'disabled' : ''}>▲</button>
        <button class="cat-move-btn" data-move="down" title="Mover categoria para baixo" ${catIdx === categorias.length - 1 ? 'disabled' : ''}>▼</button>
      </div>
      <div class="chev">▶</div>
    `;
    head.querySelector('[data-move="up"]').addEventListener('click', e => {
      e.stopPropagation();
      moveCategory(catIdx, -1);
    });
    head.querySelector('[data-move="down"]').addEventListener('click', e => {
      e.stopPropagation();
      moveCategory(catIdx, 1);
    });
    head.addEventListener('click', () => card.classList.toggle('open'));
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'cat-body';

    // Campos da categoria
    const fg = document.createElement('div');
    fg.className = 'field-grid';
    fg.innerHTML = `
      <label>Ícone</label>
      <input type="text" data-field="icone" value="${escapeAttr(cat.icone || '')}" maxlength="4">

      <label>Nome</label>
      <input type="text" data-field="nome" value="${escapeAttr(cat.nome || '')}">

      <label>Descrição</label>
      <textarea data-field="descricao" rows="2">${escapeHtml(cat.descricao || '')}</textarea>

      <label>ID interno</label>
      <input type="text" data-field="id" value="${escapeAttr(cat.id || '')}">
    `;
    fg.querySelector('[data-field="icone"]').addEventListener('input', e => { cat.icone = e.target.value; syncHead(); });
    fg.querySelector('[data-field="nome"]').addEventListener('input', e => { cat.nome = e.target.value; syncHead(); });
    fg.querySelector('[data-field="descricao"]').addEventListener('input', e => { cat.descricao = e.target.value; });
    fg.querySelector('[data-field="id"]').addEventListener('input', e => { cat.id = e.target.value; syncHead(); });
    body.appendChild(fg);

    const idHint = document.createElement('div');
    idHint.className = 'id-hint';
    idHint.textContent = "O ID é usado internamente para organizar fotos e não precisa ser mexido, a menos que você saiba o que está fazendo.";
    body.appendChild(idHint);

    if(cat.id === 'fechaduras'){
      const note = document.createElement('div');
      note.className = 'lock-note';
      note.textContent = "Você pode usar uma foto única para todo o grupo ou escolher foto individual em cada produto. Assim, fechaduras podem compartilhar uma imagem ou ter uma imagem própria por item.";
      body.appendChild(note);
    }

    // Título produtos
    const pTitle = document.createElement('div');
    pTitle.className = 'products-title';
    pTitle.innerHTML = `<h3>${cat.id === 'fechaduras' ? 'Grupos de fechadura' : 'Produtos'}</h3>`;
    body.appendChild(pTitle);
    if(cat.id !== 'fechaduras'){
      const photoModeHint = document.createElement('div');
      photoModeHint.className = 'lock-note';
      photoModeHint.textContent = 'Foto: use “Individual” para uma imagem exclusiva do produto ou “Uma foto para o grupo” para compartilhar a mesma imagem entre vários produtos.';
      body.appendChild(photoModeHint);
    }

    if(!cat.produtos) cat.produtos = [];

    if(cat.id === 'fechaduras'){
      agruparConsecutivos(cat.produtos).forEach(grupo => {
        body.appendChild(renderLockGroupCard(cat, grupo, catIdx));
      });

      const addGroupBtn = document.createElement('button');
      addGroupBtn.className = 'add-product-btn';
      addGroupBtn.textContent = '+ Adicionar novo grupo';
      addGroupBtn.addEventListener('click', () => {
        cat.produtos.push({ nome: "Novo item", preco: "R$ 0,00", grupo: "Novo grupo" });
        rerenderCategory(catIdx);
      });
      body.appendChild(addGroupBtn);
    } else {
      cat.produtos.forEach((prod, prodIdx) => {
        body.appendChild(renderProductCard(cat, prod, prodIdx));
      });

      // Botões de inclusão separados: produto sem foto (usa a foto do grupo,
      // quando houver) e produto com espaço próprio para foto individual.
      const addNoPhotoBtn = document.createElement('button');
      addNoPhotoBtn.className = 'add-product-btn';
      addNoPhotoBtn.textContent = '+ Adicionar produto sem foto / do grupo';
      addNoPhotoBtn.title = 'Cria um produto que não terá foto própria. Se houver um grupo, ele usará a foto compartilhada do grupo.';
      addNoPhotoBtn.addEventListener('click', () => {
        const gruposExistentes = cat.produtos.map(p => p.grupo).filter(g => g !== undefined && String(g).trim() !== '');
        const grupoPadrao = gruposExistentes.length ? gruposExistentes[gruposExistentes.length - 1] : '';
        const novo = { nome: 'Novo produto', preco: 'R$ 0,00', fotoModo: 'grupo' };
        if(grupoPadrao) novo.grupo = grupoPadrao;
        cat.produtos.push(novo);
        rerenderCategory(catIdx);
      });
      body.appendChild(addNoPhotoBtn);

      const addPhotoBtn = document.createElement('button');
      addPhotoBtn.className = 'add-product-btn';
      addPhotoBtn.textContent = '+ Adicionar produto com foto individual';
      addPhotoBtn.title = 'Cria um produto separado, com foto própria.';
      addPhotoBtn.addEventListener('click', () => {
        cat.produtos.push({ nome: 'Novo produto', preco: 'R$ 0,00', fotoModo: 'individual' });
        rerenderCategory(catIdx);
      });
      body.appendChild(addPhotoBtn);
    }

    // Rodapé: excluir categoria
    const footerActions = document.createElement('div');
    footerActions.className = 'cat-footer-actions';
    const delCatBtn = document.createElement('button');
    delCatBtn.className = 'btn-danger btn-sm';
    delCatBtn.textContent = 'Excluir categoria';
    delCatBtn.addEventListener('click', () => {
      if(confirm(`Excluir a categoria "${cat.nome}" e todos os seus produtos?`)){
        categorias.splice(catIdx, 1);
        renderCategories();
      }
    });
    footerActions.appendChild(delCatBtn);
    body.appendChild(footerActions);

    card.appendChild(body);

    function syncHead(){
      head.querySelector('.cat-icon-badge').textContent = cat.icone || '📦';
      head.querySelector('.name').textContent = cat.nome || '(sem nome)';
      head.querySelector('.meta').textContent = `${(cat.produtos||[]).length} produto(s) · id: ${cat.id || ''}`;
    }

    return card;
  }

  function moveCategory(catIdx, delta){
    const targetIdx = catIdx + delta;
    if(targetIdx < 0 || targetIdx >= categorias.length) return;
    const wasOpen = catList.children[catIdx] && catList.children[catIdx].classList.contains('open');
    const tmp = categorias[catIdx];
    categorias[catIdx] = categorias[targetIdx];
    categorias[targetIdx] = tmp;
    renderCategories();
    if(wasOpen && catList.children[targetIdx]) catList.children[targetIdx].classList.add('open');
  }

  function rerenderCategory(catIdx){
    const wasOpen = catList.children[catIdx] && catList.children[catIdx].classList.contains('open');
    renderCategories();
    if(wasOpen && catList.children[catIdx]) catList.children[catIdx].classList.add('open');
  }

  function renderProductCard(cat, prod, prodIdx){
    const card = document.createElement('div');
    card.className = 'product-card';

    const photoBox = document.createElement('div');
    photoBox.className = 'photo-box';

    const photoInput = document.createElement('input');
    photoInput.type = 'file';
    photoInput.accept = 'image/*';
    photoInput.style.display = 'none';

    function paintPhotoBox(){
      // Mantém a diferença entre foto do grupo e foto individual.
      while(photoBox.firstChild) photoBox.removeChild(photoBox.firstChild);
      const isGroup = prod.fotoModo === 'grupo';
      const src = findProductPhotoSrc(cat, prod);
      if(src){
        const img = document.createElement('img');
        img.src = src;
        img.alt = prod.nome || 'Produto';
        photoBox.appendChild(img);
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove-photo';
        rm.textContent = '×';
        rm.title = isGroup ? 'Remover foto do grupo' : 'Remover foto individual';
        rm.addEventListener('click', ev => {
          ev.stopPropagation();
          if(isGroup && prod.grupo){
            delete imagensCustom[prod.grupo];
            imagensOcultas['group:' + prod.grupo] = true;
          } else if(prod.foto){
            delete imagensCustom[prod.foto];
            imagensOcultas[prod.foto] = true;
            delete prod.foto;
          }
          prod.semFoto = true;
          paintPhotoBox();
        });
        photoBox.appendChild(rm);
      } else {
        const lbl = document.createElement('div');
        lbl.className = 'ph-label';
        lbl.textContent = isGroup ? 'Adicionar foto do grupo' : 'Adicionar foto individual';
        photoBox.appendChild(lbl);
      }
      photoBox.appendChild(photoInput);
    }

    photoBox.addEventListener('click', ev => {
      if(ev.target.closest('.remove-photo')) return;
      photoInput.click();
    });
    photoInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        if(prod.fotoModo === 'grupo'){
          if(!prod.grupo){
            prod.grupo = prompt('Nome do grupo para compartilhar a foto:', '') || '';
          }
          if(!prod.grupo){ return; }
          // Foto de grupo usa o próprio nome do grupo como chave.
          imagensCustom[prod.grupo] = evt.target.result;
          delete imagensOcultas['group:' + prod.grupo];
          // O produto do grupo não guarda uma foto individual.
          if(prod.foto){
            delete imagensCustom[prod.foto];
            delete prod.foto;
          }
        } else {
          const key = prod.foto || uniqueFotoKey();
          imagensCustom[key] = evt.target.result;
          delete imagensOcultas[key];
          prod.foto = key;
        }
        delete prod.semFoto;
        paintPhotoBox();
      };
      reader.readAsDataURL(file);
      // Permite escolher novamente a mesma imagem depois.
      photoInput.value = '';
    });
    paintPhotoBox();
    card.appendChild(photoBox);

    fields.appendChild(fieldBlock('Nome', 'nome', prod.nome, true, false));
    if(prod.grupo !== undefined) fields.appendChild(fieldBlock('Grupo', 'grupo', prod.grupo, true, false));
    fields.appendChild(fieldBlock('Preço', 'preco', prod.preco, false, false));
    fields.appendChild(fieldBlock('Condição (opcional)', 'condicao', prod.condicao, false, false));

    if(cat.id !== 'fechaduras'){
      const modeWrap = document.createElement('div');
      const modeLabel = document.createElement('label');
      modeLabel.textContent = 'Foto';
      modeWrap.appendChild(modeLabel);
      const modeSelect = document.createElement('select');
      modeSelect.style.cssText = 'width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;';
      modeSelect.innerHTML = '<option value="individual">Individual</option><option value="grupo">Uma foto para o grupo</option>';
      modeSelect.value = prod.fotoModo === 'grupo' ? 'grupo' : 'individual';
      modeSelect.addEventListener('change', e => {
        prod.fotoModo = e.target.value;
        if(prod.fotoModo === 'grupo' && !prod.grupo){
          prod.grupo = prompt('Nome do grupo para compartilhar a foto:', '') || '';
        }
        if(prod.fotoModo === 'individual') delete prod.fotoModo;
        rerenderCategory(categorias.indexOf(cat));
      });
      modeWrap.appendChild(modeSelect);
      fields.appendChild(modeWrap);
    }
    fields.appendChild(fieldBlock('Descrição (opcional)', 'desc', prod.desc, true, true));
    card.appendChild(fields);

    const actions = document.createElement('div');
    actions.className = 'product-actions';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-danger btn-sm';
    delBtn.textContent = 'Excluir';
    delBtn.addEventListener('click', () => {
      cat.produtos.splice(prodIdx, 1);
      rerenderCategory(categorias.indexOf(cat));
    });
    actions.appendChild(delBtn);
    card.appendChild(actions);
    return card;
  }

  // Card de um GRUPO de fechadura: uma única foto compartilhada por todos os itens do grupo,
  // e cada item aparece como uma linha compacta (sem foto própria), igual ao catálogo final.
  function renderLockGroupCard(cat, grupo, catIdx){
    const card = document.createElement('div');
    card.className = 'lock-group-card';
    let nomeAtual = grupo.nome || '';

    const header = document.createElement('div');
    header.className = 'lock-group-header';

    const photoColumn = document.createElement('div');
    photoColumn.style.cssText = 'flex:0 0 110px;display:flex;flex-direction:column;gap:6px;';
    const photoBox = document.createElement('div');
    photoBox.className = 'photo-box lock-group-photo-box';
    const chooseBtn = document.createElement('button');
    chooseBtn.type = 'button';
    chooseBtn.className = 'btn-ghost btn-sm';
    chooseBtn.textContent = 'Escolher foto';
    chooseBtn.style.width = '100%';
    const photoInput = document.createElement('input');
    photoInput.type = 'file';
    photoInput.accept = 'image/*';
    photoInput.style.display = 'none';

    function paintPhotoBox(){
      photoBox.innerHTML = '';
      const src = findGroupPhotoSrc(nomeAtual);
      if(src){
        const img = document.createElement('img');
        img.src = src;
        img.alt = nomeAtual || 'Grupo';
        photoBox.appendChild(img);
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove-photo';
        rm.textContent = '×';
        rm.title = 'Remover foto do grupo';
        rm.addEventListener('click', ev => {
          ev.stopPropagation();
          if(nomeAtual){
            delete imagensCustom[nomeAtual];
            imagensOcultas['group:' + nomeAtual] = true;
          }
          paintPhotoBox();
        });
        photoBox.appendChild(rm);
      } else {
        const lbl = document.createElement('div');
        lbl.className = 'ph-label';
        lbl.textContent = 'Foto do grupo';
        photoBox.appendChild(lbl);
      }
    }
    chooseBtn.addEventListener('click', () => {
      if(!nomeAtual.trim()){
        alert('Primeiro informe o nome do grupo.');
        return;
      }
      photoInput.click();
    });
    photoInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if(!file || !nomeAtual.trim()) return;
      const reader = new FileReader();
      reader.onload = evt => {
        imagensCustom[nomeAtual] = evt.target.result;
        delete imagensOcultas['group:' + nomeAtual];
        paintPhotoBox();
      };
      reader.readAsDataURL(file);
      photoInput.value = '';
    });
    paintPhotoBox();
    photoColumn.appendChild(photoBox);
    photoColumn.appendChild(chooseBtn);
    photoColumn.appendChild(photoInput);
    header.appendChild(photoColumn);

    const headerFields = document.createElement('div');
    headerFields.className = 'lock-group-header-fields';
    headerFields.innerHTML = `
      <label>Nome do grupo</label>
      <input type="text" data-field="grupo-nome" value="${escapeAttr(nomeAtual)}">
      <label>Tamanho da foto no catálogo</label>
      <select data-field="grupo-tamanho">
        ${TAMANHOS_GRUPO.map(t => `<option value="${t.valor}">${t.label}</option>`).join('')}
      </select>
    `;
    const nomeInput = headerFields.querySelector('[data-field="grupo-nome"]');
    const tamanhoSelect = headerFields.querySelector('[data-field="grupo-tamanho"]');
    tamanhoSelect.value = tamanhosCustom[nomeAtual] ? String(tamanhosCustom[nomeAtual]) : '';

    nomeInput.addEventListener('change', e => {
      const novoNome = e.target.value.trim();
      if(!novoNome){
        e.target.value = nomeAtual;
        return;
      }
      // Transfere a foto e as configurações quando o grupo é renomeado.
      if(nomeAtual !== novoNome){
        if(imagensCustom[nomeAtual]) imagensCustom[novoNome] = imagensCustom[nomeAtual];
        if(imagensOcultas['group:' + nomeAtual]) imagensOcultas['group:' + novoNome] = imagensOcultas['group:' + nomeAtual];
        if(tamanhosCustom[nomeAtual] !== undefined) tamanhosCustom[novoNome] = tamanhosCustom[nomeAtual];
        delete imagensCustom[nomeAtual];
        delete imagensOcultas['group:' + nomeAtual];
        delete tamanhosCustom[nomeAtual];
      }
      grupo.itens.forEach(({prod}) => { prod.grupo = novoNome; });
      nomeAtual = novoNome;
      paintPhotoBox();
      tamanhoSelect.value = tamanhosCustom[nomeAtual] ? String(tamanhosCustom[nomeAtual]) : '';
    });
    tamanhoSelect.addEventListener('change', e => {
      if(e.target.value) tamanhosCustom[nomeAtual] = Number(e.target.value);
      else delete tamanhosCustom[nomeAtual];
    });
    header.appendChild(headerFields);

    const headerActions = document.createElement('div');
    headerActions.className = 'lock-group-header-actions';
    const delGroupBtn = document.createElement('button');
    delGroupBtn.className = 'btn-danger btn-sm';
    delGroupBtn.textContent = 'Excluir grupo';
    delGroupBtn.addEventListener('click', () => {
      if(!confirm(`Excluir o grupo "${nomeAtual}" e todos os seus ${grupo.itens.length} item(ns)?`)) return;
      grupo.itens.map(it => it.prodIdx).sort((a,b)=>b-a).forEach(idx => cat.produtos.splice(idx,1));
      delete imagensCustom[nomeAtual];
      delete imagensOcultas['group:' + nomeAtual];
      delete tamanhosCustom[nomeAtual];
      rerenderCategory(catIdx);
    });
    headerActions.appendChild(delGroupBtn);
    header.appendChild(headerActions);
    card.appendChild(header);

    const itemsWrap = document.createElement('div');
    itemsWrap.className = 'lock-group-items-list';
    grupo.itens.forEach(({prod, prodIdx}) => itemsWrap.appendChild(renderLockItemRow(cat, prod, prodIdx, catIdx)));
    card.appendChild(itemsWrap);

    const addItemBtn = document.createElement('button');
    addItemBtn.className = 'add-product-btn btn-sm';
    addItemBtn.textContent = '+ Adicionar item a este grupo';
    addItemBtn.addEventListener('click', () => {
      const lastIdx = grupo.itens.length ? grupo.itens[grupo.itens.length-1].prodIdx : cat.produtos.length-1;
      cat.produtos.splice(lastIdx+1,0,{nome:'Novo item',preco:'R$ 0,00',grupo:nomeAtual,fotoModo:'grupo'});
      rerenderCategory(catIdx);
    });
    card.appendChild(addItemBtn);
    return card;
  }

  // Linha compacta de um item dentro de um grupo de fechadura.
  // Cada item pode usar a foto compartilhada do grupo OU uma foto própria.
  function renderLockItemRow(cat, prod, prodIdx, catIdx){
    const row = document.createElement('div');
    row.className = 'lock-item-row';

    const modeWrap = document.createElement('div');
    modeWrap.style.cssText = 'flex:0 0 150px;min-width:150px;';
    const modeLabel = document.createElement('label');
    modeLabel.textContent = 'Foto do item';
    modeLabel.style.cssText = 'font-size:11px;color:var(--text-dim);display:block;margin-bottom:2px;';
    modeWrap.appendChild(modeLabel);
    const modeSelect = document.createElement('select');
    modeSelect.style.cssText = 'width:100%;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 9px;font:inherit;font-size:13px;';
    modeSelect.innerHTML = '<option value="grupo">Foto do grupo</option><option value="individual">Foto individual</option>';
    modeSelect.value = prod.fotoModo === 'individual' ? 'individual' : 'grupo';
    modeWrap.appendChild(modeSelect);
    row.appendChild(modeWrap);

    const photoColumn = document.createElement('div');
    photoColumn.style.cssText = 'flex:0 0 110px;display:flex;flex-direction:column;gap:6px;';
    const photoBox = document.createElement('div');
    photoBox.className = 'photo-box lock-item-photo-box';
    const chooseBtn = document.createElement('button');
    chooseBtn.type = 'button';
    chooseBtn.className = 'btn-ghost btn-sm';
    chooseBtn.textContent = 'Escolher foto';
    chooseBtn.style.width = '100%';
    const photoInput = document.createElement('input');
    photoInput.type = 'file';
    photoInput.accept = 'image/*';
    photoInput.style.display = 'none';

    function paintPhotoBox(){
      photoBox.innerHTML = '';
      const individual = prod.fotoModo === 'individual';
      const src = individual ? findPhotoSrc(prod.foto, cat) : null;
      if(src){
        const img = document.createElement('img');
        img.src = src;
        img.alt = prod.nome || 'Produto';
        photoBox.appendChild(img);
        const rm = document.createElement('button');
        rm.type = 'button';
        rm.className = 'remove-photo';
        rm.textContent = '×';
        rm.title = 'Remover foto individual';
        rm.addEventListener('click', ev => {
          ev.stopPropagation();
          if(prod.foto){
            delete imagensCustom[prod.foto];
            imagensOcultas[prod.foto] = true;
            delete prod.foto;
          }
          paintPhotoBox();
        });
        photoBox.appendChild(rm);
      } else {
        const lbl = document.createElement('div');
        lbl.className = 'ph-label';
        lbl.textContent = individual ? 'Sem foto individual' : 'Usando foto do grupo';
        photoBox.appendChild(lbl);
      }
    }
    chooseBtn.addEventListener('click', () => {
      if(prod.fotoModo !== 'individual'){
        modeSelect.value = 'individual';
        prod.fotoModo = 'individual';
        paintPhotoBox();
      }
      photoInput.click();
    });
    photoInput.addEventListener('change', e => {
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        const key = prod.foto || uniqueFotoKey();
        imagensCustom[key] = evt.target.result;
        delete imagensOcultas[key];
        prod.foto = key;
        prod.fotoModo = 'individual';
        delete prod.semFoto;
        modeSelect.value = 'individual';
        paintPhotoBox();
      };
      reader.readAsDataURL(file);
      photoInput.value = '';
    });
    modeSelect.addEventListener('change', e => {
      prod.fotoModo = e.target.value;
      if(prod.fotoModo === 'grupo'){
        delete prod.semFoto;
      }
      paintPhotoBox();
    });
    paintPhotoBox();
    photoColumn.appendChild(photoBox);
    photoColumn.appendChild(chooseBtn);
    photoColumn.appendChild(photoInput);
    row.appendChild(photoColumn);

    const fields = document.createElement('div');
    fields.className = 'product-fields lock-item-fields';
    function fieldBlock(labelText, fieldName, value, full, isTextarea){
      const wrap = document.createElement('div');
      if(full) wrap.className='full';
      const label=document.createElement('label'); label.textContent=labelText; wrap.appendChild(label);
      const input=document.createElement(isTextarea?'textarea':'input');
      if(!isTextarea) input.type='text'; input.value=value||'';
      input.addEventListener('input',e=>{ const v=e.target.value; if(v==='') delete prod[fieldName]; else prod[fieldName]=v; });
      wrap.appendChild(input); return wrap;
    }
    fields.appendChild(fieldBlock('Nome','nome',prod.nome,true,false));
    fields.appendChild(fieldBlock('Preço','preco',prod.preco,false,false));
    fields.appendChild(fieldBlock('Condição (opcional)','condicao',prod.condicao,false,false));
    fields.appendChild(fieldBlock('Descrição (opcional)','desc',prod.desc,true,true));
    row.appendChild(fields);

    const delBtn=document.createElement('button');
    delBtn.className='btn-danger btn-sm lock-item-del'; delBtn.textContent='Excluir';
    delBtn.addEventListener('click',()=>{ cat.produtos.splice(prodIdx,1); rerenderCategory(catIdx); });
    row.appendChild(delBtn);
    return row;
  }

  function addCategory(){
    const nome = prompt("Nome da nova categoria:");
    if(!nome) return;
    const icone = prompt("Um emoji para representar a categoria (ex.: 🔑):", "📦") || "📦";
    const descricao = prompt("Breve descrição da categoria:", "") || "";
    const novaCategoria = {
      id: slugify(nome),
      nome: nome,
      icone: icone,
      descricao: descricao,
      produtos: []
    };
    categorias.push(novaCategoria);
    renderCategories();
    const lastCard = catList.lastElementChild;
    if(lastCard) lastCard.classList.add('open');
  }

  // ---------- Export ----------

  function ensureCustomInfra(text){
    // Garante a infraestrutura usada pelas fotos adicionadas pelo editor.
    // IMPORTANTE: a foto customizada é aplicada NO FINAL da resolução da foto
    // do produto. Assim ela sempre vence a foto nativa do catálogo.
    let out = text;

    if(out.indexOf('const IMAGENS_CUSTOM') === -1){
      out = out.replace(/const\s+CATEGORIAS\s*=\s*\[/,
        "const IMAGENS_CUSTOM = {};\n\nconst CATEGORIAS = [");
    }

    if(out.indexOf('const IMAGENS_OCULTAS') === -1){
      out = out.replace(/const\s+CATEGORIAS\s*=\s*\[/,
        "const IMAGENS_OCULTAS = {};\n\nconst CATEGORIAS = [");
    }

    if(out.indexOf('const TAMANHOS_CUSTOM') === -1){
      out = out.replace(/const\s+CATEGORIAS\s*=\s*\[/,
        "const TAMANHOS_CUSTOM = {};\n\nconst CATEGORIAS = [");
    }

    // Impede que a foto nativa apareça quando o usuário removeu uma foto.
    const nativeGuards = [
      ['if (cat.id === "copia-chaves" && p.tipo)', 'if (!p.fotoRemovida && cat.id === "copia-chaves" && p.tipo)'],
      ['else if (cat.id === "chaveirinho" && p.foto && IMAGENS_CHAVEIRINHO[p.foto])', 'else if (!p.fotoRemovida && cat.id === "chaveirinho" && p.foto && IMAGENS_CHAVEIRINHO[p.foto])'],
      ['else if (cat.id === "controle-portao" && p.foto && IMAGENS_CONTROLE[p.foto])', 'else if (!p.fotoRemovida && cat.id === "controle-portao" && p.foto && IMAGENS_CONTROLE[p.foto])'],
      ['else if (cat.id === "bateria" && p.foto && IMAGENS_BATERIA[p.foto])', 'else if (!p.fotoRemovida && cat.id === "bateria" && p.foto && IMAGENS_BATERIA[p.foto])'],
      ['else if (cat.id === "cadeados" && p.foto && IMAGENS_CADEADO[p.foto])', 'else if (!p.fotoRemovida && cat.id === "cadeados" && p.foto && IMAGENS_CADEADO[p.foto])'],
      ['else if (cat.id === "miolos" && p.foto && (IMAGENS_MIOLO[p.foto] || IMAGENS_GAVETA[p.foto] || IMAGENS_MIOLO_GRANDE[p.foto] || IMAGENS_MIOLO_TETRA[p.foto]))', 'else if (!p.fotoRemovida && cat.id === "miolos" && p.foto && (IMAGENS_MIOLO[p.foto] || IMAGENS_GAVETA[p.foto] || IMAGENS_MIOLO_GRANDE[p.foto] || IMAGENS_MIOLO_TETRA[p.foto]))'],
      ['else if (cat.id === "aberturas" && p.foto && IMAGENS_ABERTURAS[p.foto])', 'else if (!p.fotoRemovida && cat.id === "aberturas" && p.foto && IMAGENS_ABERTURAS[p.foto])'],
      ['else if (cat.id === "chaves-codificadas" && p.foto && IMAGENS_CODIFICADAS[p.foto])', 'else if (!p.fotoRemovida && cat.id === "chaves-codificadas" && p.foto && IMAGENS_CODIFICADAS[p.foto])']
    ];
    nativeGuards.forEach(([from, to]) => {
      if(out.indexOf(from) !== -1 && out.indexOf(to) === -1) out = out.replace(from, to);
    });

    // Se o catálogo já tiver nosso override, não o duplica.
    const customOverrideMarker = '/* EDITOR_CUSTOM_PHOTO_OVERRIDE_V3 */';
    if(out.indexOf(customOverrideMarker) === -1){
      const override = `
        ${customOverrideMarker}
        // Fotos individuais adicionadas pelo editor têm prioridade absoluta.
        if (!p.semFoto && p.fotoModo === 'grupo' && p.grupo &&
            !IMAGENS_OCULTAS['group:' + p.grupo] && IMAGENS_CUSTOM[p.grupo]) {
          imagemChave = \`<img src="\${IMAGENS_CUSTOM[p.grupo]}" style="width:100%;height:100%;object-fit:cover;object-position:center;display:block;" alt="\${p.nome}" />\`;
        } else if (!p.semFoto && p.foto && !IMAGENS_OCULTAS[p.foto] && IMAGENS_CUSTOM[p.foto]) {
          imagemChave = \`<img src="\${IMAGENS_CUSTOM[p.foto]}" style="width:100%;height:100%;object-fit:cover;object-position:center;display:block;" alt="\${p.nome}" />\`;
        }
        if (p.semFoto) imagemChave = null;
`;

      // O ponto correto é imediatamente antes do HTML do produto ser retornado.
      // Isso garante que blocos de fotos nativas executados antes não sobrescrevam
      // a foto escolhida pelo usuário.
      const returnRegex = /(\n\s*)return\s+`\s*\n\s*<div class="product">/;
      if(returnRegex.test(out)){
        out = out.replace(returnRegex, `$1${override}$1return \`\n          <div class="product">`);
      } else {
        // Fallback para versões do catálogo com outra formatação.
        const initRegex = /(let\s+imagemChave\s*=\s*null\s*;)/;
        if(initRegex.test(out)){
          out = out.replace(initRegex, `$1${override}`);
        }
      }
    }

    // Foto compartilhada de grupos de fechadura.
    if(out.indexOf('IMAGENS_CUSTOM[g.nome]') === -1){
      const groupRegex = /<div class="lock-group__photo" data-grupo="\$\{g\.nome\}">[\s\S]*?<\/div>/;
      if(groupRegex.test(out)){
        out = out.replace(groupRegex,
          '<div class="lock-group__photo" data-grupo="${g.nome}">${(IMAGENS_FECHADURA[g.nome] || IMAGENS_CUSTOM[g.nome]) ? `<img src="${IMAGENS_FECHADURA[g.nome] || IMAGENS_CUSTOM[g.nome]}" alt="${g.nome}">` : cat.icone}</div>');
      }
    }

    return out;
  }

  function exportCatalog(){
    if(!categorias){ return; }

    let out = ensureCustomInfra(rawHtml);

    // Marca a versão das fotos para que o catálogo exportado saiba que o editor
    // gravou fotos individuais e fotos compartilhadas por grupo.
    if(out.indexOf('CATALOGO_EDITOR_FOTOS_V2') === -1){
      out = out.replace('</head>', '<meta name="CATALOGO_EDITOR_FOTOS_V2" content="individual-e-grupo">\n</head>');
    }

    // Substitui o bloco IMAGENS_CUSTOM
    const customDecl = extractDeclaration(out, "IMAGENS_CUSTOM");
    const customSerialized = JSON.stringify(imagensCustom, null, 2);
    if(customDecl){
      out = out.slice(0, customDecl.contentStart) + customSerialized + out.slice(customDecl.contentEnd);
    }

    // Substitui o bloco IMAGENS_OCULTAS (precisa re-extrair pois os offsets mudaram)
    const ocultasDecl = extractDeclaration(out, "IMAGENS_OCULTAS");
    const ocultasSerialized = JSON.stringify(imagensOcultas, null, 2);
    if(ocultasDecl){
      out = out.slice(0, ocultasDecl.contentStart) + ocultasSerialized + out.slice(ocultasDecl.contentEnd);
    }

    // Substitui o bloco TAMANHOS_CUSTOM (precisa re-extrair pois os offsets mudaram)
    const tamanhosDecl = extractDeclaration(out, "TAMANHOS_CUSTOM");
    const tamanhosSerialized = JSON.stringify(tamanhosCustom, null, 2);
    if(tamanhosDecl){
      out = out.slice(0, tamanhosDecl.contentStart) + tamanhosSerialized + out.slice(tamanhosDecl.contentEnd);
    }

    // Substitui o bloco CATEGORIAS (precisa re-extrair pois os offsets mudaram)
    const catDecl = extractDeclaration(out, "CATEGORIAS");
    const catSerialized = JSON.stringify(categorias, null, 2);
    if(catDecl){
      out = out.slice(0, catDecl.contentStart) + catSerialized + out.slice(catDecl.contentEnd);
    }

    const blob = new Blob([out], { type: 'text/html;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const stamp = new Date().toISOString().slice(0,10);
    a.download = `catalogo-chaveiro-senador-${stamp}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // ---------- Helpers ----------

  function escapeHtml(str){
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
  function escapeAttr(str){
    return escapeHtml(str).replace(/"/g, '&quot;');
  }

})();
</script>
